  <header class="page-header text-center">
    <div class="container">
      <h1>İletişim</h1>
      <p>Form elemanları JavaScript ve Vue.js ile denetlenecektir.</p>
    </div>
  </header>

  <main class="container my-5">
    <div id="iletisimApp" class="form-container shadow">
      <form id="iletisimForm" action="iletisim-sonuc.php" method="post" novalidate>

        <div class="mb-3">
          <label for="adSoyad" class="form-label">Ad Soyad</label>
          <input type="text" class="form-control" id="adSoyad" name="adSoyad" v-model="form.adSoyad">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">E-posta</label>
          <input type="text" class="form-control" id="email" name="email" v-model="form.email">
        </div>

        <div class="mb-3">
          <label for="telefon" class="form-label">Telefon</label>
          <input type="text" class="form-control" id="telefon" name="telefon" v-model="form.telefon">
        </div>

        <div class="mb-3">
          <label for="konu" class="form-label">Konu</label>
          <select class="form-select" id="konu" name="konu" v-model="form.konu">
            <option value="">Seçiniz</option>
            <option value="Oneri">Öneri</option>
            <option value="Soru">Soru</option>
            <option value="Sikayet">Şikayet</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Cinsiyet</label><br>
          <input type="radio" id="erkek" name="cinsiyet" value="Erkek" v-model="form.cinsiyet">
          <label for="erkek">Erkek</label>
          <input type="radio" id="kadin" name="cinsiyet" value="Kadın" class="ms-3" v-model="form.cinsiyet">
          <label for="kadin">Kadın</label>
        </div>

        <div class="mb-3">
          <label class="form-label">İlgi Alanları</label><br>
          <input type="checkbox" id="futbol" name="ilgiAlanlari[]" value="Futbol" v-model="form.ilgiAlanlari">
          <label for="futbol">Futbol</label><br>
          <input type="checkbox" id="got" name="ilgiAlanlari[]" value="Game of Thrones" v-model="form.ilgiAlanlari">
          <label for="got">Game of Thrones</label><br>
          <input type="checkbox" id="kitap" name="ilgiAlanlari[]" value="Kitap Okumak" v-model="form.ilgiAlanlari">
          <label for="kitap">Kitap Okumak</label>
        </div>

        <div class="mb-3">
          <label for="mesaj" class="form-label">Mesaj</label>
          <textarea class="form-control" id="mesaj" name="mesaj" rows="5" v-model="form.mesaj"></textarea>
        </div>

        <div id="hataMesajlari" class="alert alert-danger d-none"></div>
        <div v-if="vueHatalar.length > 0" class="alert alert-warning">
          <ul class="mb-0">
            <li v-for="hata in vueHatalar">{{ hata }}</li>
          </ul>
        </div>

        <div class="d-flex gap-2 flex-wrap">
          <button type="button" class="btn btn-secondary" onclick="jsKontrol()">JavaScript ile Kontrol Et</button>
          <button type="button" class="btn btn-info text-white" @click="vueKontrol">Vue.js ile Kontrol Et</button>
          <button type="submit" class="btn btn-success">Gönder</button>
          <button type="reset" class="btn btn-danger">Temizle</button>
        </div>
      </form>
    </div>
